<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="RatterAU — I build apps for things I want a better version of">
  <style>
    .name { font: 800 66px ui-sans-serif, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -2px; }
    .line { font: 500 21px ui-sans-serif, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .name { fill: #14181F; }
    .line { fill: #6A7480; }
    .rule { stroke: #14181F; }
    .dot  { fill: #14181F; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #F4F6F8; }
      .line { fill: #8A94A2; }
      .rule { stroke: #F4F6F8; }
      .dot  { fill: #F4F6F8; }
    }
  </style>

  <g transform="translate(18 0)">
    <text class="name" x="0" y="88">RatterAU</text>
    <path class="rule" d="M2 120H150" stroke-width="3" stroke-linecap="round"/>
    <text class="line" x="0" y="166">I build apps for things I want a better version of.</text>
  </g>
</svg>
